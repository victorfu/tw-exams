[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-exams"
version = "0.1.0"
description = "Search and download tcool exam PDFs through a browser session"
requires-python = ">=3.10"
dependencies = ["playwright>=1.51,<2", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"]

[project.scripts]
tw-exams = "tcool.cli:main"

[tool.setuptools.packages.find]
include = ["tcool*"]
